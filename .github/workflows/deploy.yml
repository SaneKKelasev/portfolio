name: CI/CD Laravel

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, pdo_sqlite

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Install PHP Dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Check PHP Code Style
        run: vendor/bin/pint --test

      - name: Prepare Laravel Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Verify Frontend Build
        run: |
          test -f public/build/manifest.json
          test -d public/build/assets

      - name: Run PHP Tests
        run: php artisan test

      - name: Package Frontend Build
        if: github.event_name == 'push'
        run: |
          tar \
            -czf "frontend-build-${{ github.sha }}.tar.gz" \
            public/build

      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend-build-${{ github.sha }}.tar.gz
          retention-days: 1

  deploy-staging:
    name: Deploy Staging
    needs: tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: staging
      url: https://staging.portfoliohub.ru

    concurrency:
      group: staging-deploy
      cancel-in-progress: false

    steps:
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}

      - name: Upload Frontend Build to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: frontend-build-${{ github.sha }}.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy Staging via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            PROJECT_DIR="/var/www/projects/portfolio-staging"
            DEPLOY_SHA="${{ github.sha }}"
            BUILD_ARCHIVE="/tmp/frontend-build-${DEPLOY_SHA}.tar.gz"

            cd "$PROJECT_DIR"

            cleanup() {
              rm -f "$BUILD_ARCHIVE"
              php artisan up >/dev/null 2>&1 || true
            }

            trap cleanup EXIT

            test -f "$BUILD_ARCHIVE"

            php artisan down --retry=60

            git fetch --prune origin develop
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"

            composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-dev \
              --no-progress

            php artisan optimize:clear

            rm -rf public/build
            tar -xzf "$BUILD_ARCHIVE" -C "$PROJECT_DIR"

            test -f public/build/manifest.json
            test -d public/build/assets

            php artisan migrate --force
            php artisan optimize
            php artisan up

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              https://staging.portfoliohub.ru/up > /dev/null

            rm -f "$BUILD_ARCHIVE"
            trap - EXIT

            echo "Staging deployment of ${DEPLOY_SHA} completed successfully."

  deploy-production:
    name: Deploy Production
    needs: tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: https://portfoliohub.ru

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}

      - name: Upload Frontend Build to Server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: frontend-build-${{ github.sha }}.tar.gz
          target: /tmp
          overwrite: true

      - name: Deploy Production via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            PROJECT_DIR="/var/www/projects/portfolio"
            DEPLOY_SHA="${{ github.sha }}"
            BUILD_ARCHIVE="/tmp/frontend-build-${DEPLOY_SHA}.tar.gz"

            cd "$PROJECT_DIR"

            cleanup() {
              rm -f "$BUILD_ARCHIVE"
              php artisan up >/dev/null 2>&1 || true
            }

            trap cleanup EXIT

            test -f "$BUILD_ARCHIVE"

            php artisan down --retry=60

            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git reset --hard "$DEPLOY_SHA"

            composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-dev \
              --no-progress

            php artisan optimize:clear

            rm -rf public/build
            tar -xzf "$BUILD_ARCHIVE" -C "$PROJECT_DIR"

            test -f public/build/manifest.json
            test -d public/build/assets

            php artisan migrate --force
            php artisan optimize
            php artisan up

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 5 \
              --retry-delay 2 \
              --retry-connrefused \
              https://portfoliohub.ru/up > /dev/null

            rm -f "$BUILD_ARCHIVE"
            trap - EXIT

            echo "Production deployment of ${DEPLOY_SHA} completed successfully."
